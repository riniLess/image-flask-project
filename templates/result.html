<!DOCTYPE html>
<html lang='ru'>
<head>
    <title>Результат</title>
</head>
<body>
    <h1>Исходное изображение</h1>
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/original.jpg') }}">
    <h2>Гистограммы</h2>
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/original_red.png') }}">
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/original_green.png') }}">
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/original_blue.png') }}">
    <h2>Классификация</h2>
    <p>{{ classification }}</p>

    {% for i in range(1, 5) %}
    <h1>Часть {{ i }}</h1>
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/part' + i|string + '.jpg') }}">
    <h2>Гистограммы</h2>
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/part' + i|string + '_red.png') }}">
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/part' + i|string + '_green.png') }}">
    <img src="{{ url_for('static', filename='uploads/' + uuid + '/part' + i|string + '_blue.png') }}">
    {% endfor %}
</body>
</html>
